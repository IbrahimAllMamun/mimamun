# Local development services.
#
#   docker compose up -d postgres          # database only; run the apps with `npm run dev`
#   docker compose --profile mail up -d    # plus Mailpit to catch emails (http://localhost:8025)
#   docker compose --profile app up --build  # everything in containers (http://localhost:3000)
#
# Values come from .env (see .env.example); the defaults match it.

name: portfolio

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    profiles: ["mail"]
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  migrate:
    profiles: ["app"]
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["node", "dist/migrate.js"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD:-portfolio}@postgres:5432/${POSTGRES_DB:-portfolio}
    depends_on:
      postgres: { condition: service_healthy }

  api:
    profiles: ["app"]
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: [.env]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD:-portfolio}@postgres:5432/${POSTGRES_DB:-portfolio}
      WEB_INTERNAL_URL: http://web:3000
      APP_URL: http://localhost:3000
      # .env's UPLOAD_DIR is a host path; inside the container use the volume.
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args: { API_INTERNAL_URL: "http://api:4000" }
    environment:
      APP_URL: http://localhost:3000
      API_INTERNAL_URL: http://api:4000
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres-data:
  uploads:
