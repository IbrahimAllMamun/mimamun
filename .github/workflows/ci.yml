name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # Test-only values; never used outside CI.
  APP_URL: http://localhost:3000
  APP_SECRET: ci-only-app-secret-that-is-long-enough-1234567890
  REVALIDATE_SECRET: ci-only-revalidate-secret-1234567890
  API_INTERNAL_URL: http://localhost:4000
  WEB_INTERNAL_URL: http://localhost:3000
  DATABASE_URL: postgres://portfolio:portfolio@localhost:5432/portfolio
  TEST_DATABASE_URL: postgres://portfolio:portfolio@localhost:5432/portfolio_test
  SEED_ADMIN_EMAIL: admin@example.com
  SEED_ADMIN_PASSWORD: ci-admin-password-1234

jobs:
  checks:
    name: Lint, types and unit/integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
          POSTGRES_DB: portfolio_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Unit and integration tests (shared, web, API against PostgreSQL)
        run: npm test

  e2e:
    name: End-to-end, accessibility and visual tests
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
          POSTGRES_DB: portfolio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      JOBS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
      - name: Migrate and seed
        run: npm run db:migrate && npm run db:seed
      - name: Playwright
        run: npx playwright test
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: portfolio-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: portfolio-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
